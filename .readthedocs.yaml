version: 2

build:
  os: ubuntu-24.04
  tools:
    nodejs: "24"
    python: "3.12"
  commands:
    - corepack enable && corepack prepare pnpm@10.33.4 --activate
    - corepack pnpm --version
    - corepack pnpm install --frozen-lockfile
    - corepack pnpm build
    - corepack pnpm docs:api --out "$READTHEDOCS_OUTPUT/html"
