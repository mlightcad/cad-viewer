<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Loose (exploded) repeated geometry -->
  <rect x="1.6" y="1.6" width="7" height="6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.6 1.1"/>
  <circle cx="5.1" cy="4.6" r="1.6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.3 0.9"/>
  <!-- Conversion arrow -->
  <path fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"
    d="M10.6 4.6h2.6c1 0 1.8.8 1.8 1.8v2.2M13.3 7.2 15 9l1.7-1.8"/>
  <!-- Resulting block: same geometry grouped into one object -->
  <rect x="7.6" y="10.4" width="10.8" height="8" rx="1.2" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.25"/>
  <rect x="9.6" y="12" width="6.8" height="4.8" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <circle cx="13" cy="14.4" r="1.4" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <!-- Block base point -->
  <rect x="6.6" y="17.4" width="2" height="2" fill="currentColor"/>
</svg>
