<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aitra CadViewer</title>
    <meta
      name="description"
      content="Aitra CadViewer — web viewer for DWG and DXF drawings, based on the open-source mlightcad/cad-viewer."
    />
    <meta name="application-name" content="Aitra CadViewer" />
    <meta name="theme-color" content="#0f1720" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aitra" />
    <meta property="og:title" content="Aitra CadViewer" />
    <meta
      property="og:description"
      content="Web viewer for DWG and DXF drawings, based on the open-source mlightcad/cad-viewer."
    />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ccc;
        border-top-color: #409EFF; /* Element Plus primary color */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
    
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading overlay -->
    <div id="loader" style="
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      z-index: 9999;
    ">
      <div class="spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
